<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/chronos-icon-square.png" />
    <link rel="apple-touch-icon" href="/chronos-icon-square.png" />
    <link rel="preload" as="image" href="/chronos-icon-square.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="application-name" content="Chronos" />
    <meta name="apple-mobile-web-app-title" content="Chronos" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#06090d" />
    <meta name="description" content="CHRONOS: Titan of Time - Zamanın değerini hatırlatan antik çarklar ve kum saati ile Pomodoro odaklanma zamanlayıcısı." />
    <title>CHRONOS • Titan of Time - Pomodoro Zamanlayıcısı</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Clean up any external injected Netlify widgets/badges
      const removeNetlifyWidgets = () => {
        document.querySelectorAll('netlify-drawer, [data-netlify-drawer], iframe[src*="netlify"], a[href*="netlify.com"]').forEach((el) => el.remove());
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', removeNetlifyWidgets);
      } else {
        removeNetlifyWidgets();
      }
      setTimeout(removeNetlifyWidgets, 1000);
      setTimeout(removeNetlifyWidgets, 2500);

      // Register PWA Service Worker for browser installation & offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('PWA ServiceWorker registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
